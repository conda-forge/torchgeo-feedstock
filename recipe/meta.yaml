{% set name = "torchgeo" %}
{% set version = "0.10.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/torchgeo-{{ version }}.tar.gz
  sha256: fc0357a4d6847cbd7cd5baa0f6a48b61c9a7b83f11d2d1a4c8c9d35de9f0bc26

build:
  entry_points:
    - torchgeo = torchgeo.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - uv-build >=0.7
    - pip
  run:
    - python >={{ python_min }}
    - einops >=0.3
    - geopandas >=1
    - jsonargparse >=4.39
    - kornia >=0.8.2
    - lightly >=1.5.1
    - lightning >=2.4,!=2.5.0,!=2.5.5,!=2.5.6
    - matplotlib-base >=3.7.3
    - numpy >=1.26
    - pandas >=2.1.1
    - pillow >=10
    - pyogrio >=0.10
    - pyproj >=3.6.1
    - rasterio >=1.4.3
    - requests >=2.25
    - segmentation-models-pytorch >=0.5
    - shapely >=2.0.2
    - timm >=1.0.3
    - pytorch >=2.2
    - torchmetrics >=1.5
    - torchvision >=0.17
    - tqdm >=4.57
    - typing-extensions >=4.8

    # Needed by LightningCLI
    - docstring_parser >=0.17
    - typeshed-client >=2.8.2
    - jsonnet >=0.21

test:
  imports:
    - torchgeo
    - torchgeo.datamodules
    - torchgeo.datasets
    - torchgeo.losses
    - torchgeo.models
    - torchgeo.profilers
    - torchgeo.samplers
    - torchgeo.trainers
    - torchgeo.transforms
  commands:
    - pip check
    - torchgeo --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/torchgeo/torchgeo
  license: MIT
  license_file: LICENSE
  summary: 'TorchGeo: datasets, samplers, transforms, and pre-trained models for geospatial data'
  description: |
    TorchGeo is a PyTorch domain library, similar to torchvision, providing datasets, samplers, transforms, and pre-trained models specific to geospatial data.

    The goal of this library is to make it simple

    1. for machine learning experts to work with geospatial data, and
    2. for remote sensing experts to explore machine learning solutions.
  dev_url: https://github.com/torchgeo/torchgeo
  doc_url: https://docs.torchgeo.org

extra:
  recipe-maintainers:
    - adamjstewart
    - calebrob6
    - isaaccorley
    - nilsleh
    - ashnair1
    - robmarkcole
